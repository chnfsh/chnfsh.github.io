<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>亚太ABC - 圈里圈外</title>
<style>
:root{
  --bg:#f4f2ee; --surface:#ffffff; --surface-2:#f9f8f5; --ink:#1d2330; --ink-2:#4a5263; --muted:#8a90a0;
  --line:#e4e1da; --accent:#1f4e79; --accent-soft:#e6eef6; --warm:#b5651d; --warm-soft:#fbefe3;
  --ok:#2e7d4f; --danger:#b3261e; --mark:#ffe58a; --hub:#7a4fa3; --hub-soft:#efe7f7; --c3:#3f7f5a; --shadow:0 1px 2px rgba(20,25,40,.06),0 4px 14px rgba(20,25,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171d; --surface:#1d2129; --surface-2:#232833; --ink:#e8eaee; --ink-2:#b8bdc8; --muted:#7f8696;
    --line:#2e3440; --accent:#8db8e3; --accent-soft:#22324a; --warm:#e0a066; --warm-soft:#3a2b1d;
    --ok:#6fcf97; --danger:#ff8a80; --mark:#7a6420; --shadow:none; --hub:#c9a6ec; --hub-soft:#33284a; --c3:#7fc59a;
  }
}
:root[data-theme="dark"]{
  --bg:#14171d; --surface:#1d2129; --surface-2:#232833; --ink:#e8eaee; --ink-2:#b8bdc8; --muted:#7f8696;
  --line:#2e3440; --accent:#8db8e3; --accent-soft:#22324a; --warm:#e0a066; --warm-soft:#3a2b1d;
  --ok:#6fcf97; --danger:#ff8a80; --mark:#7a6420; --shadow:none; --hub:#c9a6ec; --hub-soft:#33284a; --c3:#7fc59a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;padding:10px 16px 8px}
.title-row{display:flex;align-items:center;gap:8px}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 10px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.iconbtn:active{transform:scale(.97)}
.search{display:flex;gap:8px;margin-top:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;outline:none}
.search input:focus{border-color:var(--accent)}
.search select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 8px;max-width:118px}
.tabs{flex:1;min-width:0;align-items:center;display:flex;gap:6px;margin-top:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs.fr{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 30px),transparent 100%);mask-image:linear-gradient(to right,#000 calc(100% - 30px),transparent 100%)}
.tabs.fl{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 30px);mask-image:linear-gradient(to right,transparent 0,#000 30px)}
.tabs.fl.fr{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 30px,#000 calc(100% - 30px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 30px,#000 calc(100% - 30px),transparent 100%)}
@media (max-width:400px){.tabs{gap:4px}.tabs .tab{padding:5px 9px;font-size:13px}.tabs .tab b{margin-left:3px}.tabbar{gap:6px}.sq{min-width:50px;padding:0 5px;font-size:10.5px}}
.tabbar{display:flex;align-items:center;gap:8px;margin-top:8px}
.sq{flex:0 0 auto;min-width:54px;height:46px;padding:0 7px;border-radius:12px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;line-height:1.1;white-space:nowrap;cursor:pointer}
.sq svg{width:19px;height:19px}
.sq.cal{background:var(--accent-soft);color:var(--accent)}
.sq.net{background:var(--hub-soft);color:var(--hub)}
.sq.cal.on{background:var(--accent);color:#fff}
.sq.net.on{background:var(--hub);color:#fff}
:root[data-theme="dark"] .sq.on{color:#10141b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sq.on{color:#10141b}}
.sq:active{transform:scale(.96)}
.pubbtn{border:0;background:var(--warm);color:#fff;border-radius:9px;padding:5px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.cat-row{display:grid;grid-template-columns:1fr 1.6fr auto;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px}
.cat-row input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 8px;width:100%;min-width:0;font-size:14px}
.cat-row .ops{display:flex;gap:4px}
.cat-row .n{grid-column:1/-1;font-size:12px;color:var(--muted)}
.form select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 10px;width:100%;font-size:15px}
.chk{flex-direction:row!important;align-items:center;gap:6px!important;color:var(--ink-2)!important;font-size:13.5px!important}
.chk input{width:auto!important}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--ink-2)}
.tab b{font-weight:600;margin-left:4px;color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .tab.on{color:#10141b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab.on{color:#10141b}}
.tab.on b{color:inherit;opacity:.8}
.banner{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:var(--warm-soft);color:var(--ink);font-size:13px;display:flex;gap:10px;align-items:center}
.banner span{flex:1}
.banner button{border:0;background:var(--warm);color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;white-space:nowrap}
.meta{color:var(--muted);font-size:12.5px;margin:12px 2px 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.meta label{display:flex;align-items:center;gap:5px;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.rec-h{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px}
.rec-top{display:flex;align-items:flex-start;gap:8px}
.rec-name{font-weight:650;font-size:16px;flex:1;min-width:0;word-break:break-word}
.no{color:var(--muted);font-weight:500;font-size:13px;margin-right:4px}
.chev{color:var(--muted);transition:transform .2s;flex:0 0 auto;margin-top:3px}
.rec.open .chev{transform:rotate(90deg)}
.sub{color:var(--ink-2);font-size:13.5px;margin-top:2px;word-break:break-word}
.sub .sep{color:var(--line);margin:0 6px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.bdg{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.bdg.v{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.bdg.v0{color:var(--muted)}
.bdg.d{background:var(--warm-soft);color:var(--warm);border-color:transparent}
.vlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vchip{font-size:12.5px;border-radius:7px;padding:2px 8px;background:var(--accent-soft);color:var(--ink-2);white-space:nowrap}
.vchip b{color:var(--accent);font-weight:600;margin-right:5px}
.vchip.u{background:var(--surface-2);border:1px dashed var(--line)}
.vchip.u span{color:var(--muted)}
.rec.open .vlist{display:none}
.visit.flash .v-t{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background:var(--mark)}100%{background:transparent}}
.body{display:none;border-top:1px solid var(--line);padding:4px 14px 14px}
.rec.open .body{display:block}
.sec-t{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;margin:12px 0 8px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.visit{position:relative;padding:0 0 14px 18px;border-left:2px solid var(--line);margin-left:5px}
.visit:last-of-type{padding-bottom:4px}
.visit::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.v-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.v-h strong{color:var(--accent);font-size:13px}
.v-t{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.v-t mark,.preview mark,.rec-name mark,.sub mark,.card-t mark{background:var(--mark);color:inherit;border-radius:2px}
.none{color:var(--muted);font-size:13.5px;padding:2px 0 6px}
.cards-tg{display:flex;align-items:center;gap:8px;width:100%;border:1px dashed var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:13.5px;color:var(--ink-2);margin-top:12px;text-align:left}
.cards-tg .chev{margin:0}
.cards-tg.on .chev{transform:rotate(90deg)}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.card-t{white-space:pre-wrap;word-break:break-word;font-size:13.5px;color:var(--ink-2)}
.card-t .l1{color:var(--ink);font-weight:600}
.card-img-btn{margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--accent)}
.card img{display:block;max-width:100%;height:auto;border-radius:8px;margin-top:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:13.5px;color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#10141b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#10141b}}
.btn.dan{color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.form{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.form label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.form input,.form textarea{color:var(--ink);font-size:15px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;outline:none;width:100%}
.form input:focus,.form textarea:focus{border-color:var(--accent)}
.form textarea{min-height:110px;resize:vertical;line-height:1.6}
.ed-item{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2)}
.ed-item .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:12.5px;color:var(--muted)}
.thumb{max-width:140px;max-height:90px;border-radius:6px;border:1px solid var(--line);display:block}
.fab{position:fixed;right:max(16px,calc(50% - 374px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:15;border:0;background:var(--accent);color:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(20,40,80,.28)}
body.editing .fab{display:none}
:root[data-theme="dark"] .fab{color:#10141b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fab{color:#10141b}}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0 0 4px;font-size:16px}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox.zoom{align-items:flex-start;justify-content:flex-start}
.lightbox.zoom img{max-width:none;max-height:none;width:200%}
.lb-x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:61;border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;width:36px;height:36px;font-size:18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.menu{position:absolute;right:16px;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.15);padding:6px;z-index:30;min-width:220px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--surface-2)}
.menu small{display:block;color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
a.xref{color:var(--accent);text-decoration:underline;text-decoration-style:solid;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer;font-weight:600}
a.xref.hub{color:var(--hub);text-decoration-style:dotted}
a.xref.flashlink{animation:flash 1.6s ease;border-radius:3px}
.bdg.lk{background:var(--hub-soft);color:var(--hub);border-color:transparent}
.rel{display:flex;flex-direction:column;gap:6px}
.rel-i{display:flex;gap:8px;align-items:baseline;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 10px;text-align:left;width:100%;font-size:13.5px}
.rel-i .k{flex:0 0 auto;font-size:12px;color:var(--muted);min-width:46px}
.rel-i .n{font-weight:600;color:var(--accent)}
.rel-i.h .n{color:var(--hub)}
.rel-i .s{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.rel-i .s b{color:var(--ink-2);font-weight:600}
.backpill{position:fixed;left:max(16px,calc(50% - 374px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:16;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.g{border-style:dashed}
.tab.g.on{border-style:solid}
body.graph .meta,body.graph #sort,body.graph .fab{display:none}
body.cal .meta,body.cal #sort,body.cal .fab{display:none}
@media (min-width:900px){body.cal .wrap,body.cal .top-in{max-width:1120px}}
.cal-head{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:12px}
.cal-head .mt{border:0;background:none;color:var(--ink);font-weight:650;font-size:17px;letter-spacing:.02em;padding:6px 10px;border-radius:10px;min-width:118px;text-align:center;cursor:pointer}
.cal-head .mt:active{background:var(--accent-soft)}
.cal-head .mt small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:-1px}
.cal-nav{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:40px;height:40px;font-size:20px;color:var(--ink-2);line-height:1;flex:0 0 auto}
.cal-nav:active{background:var(--accent-soft)}
.calz{touch-action:pan-y}
.calz.z-in{animation:zin .22s ease-out}.calz.z-out{animation:zout .22s ease-out}.calz.s-l{animation:sl .2s ease-out}.calz.s-r{animation:sr .2s ease-out}
@keyframes zin{from{opacity:.3;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes zout{from{opacity:.3;transform:scale(1.08)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:.4;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:.4;transform:translateX(-28px)}to{opacity:1;transform:none}}
.yg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
@media (min-width:700px){.yg{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}}
.ym{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 5px 8px;cursor:pointer;min-width:0;transition:border-color .15s}
.ym.cur{border-color:var(--accent)}
.ym.emp{opacity:.72}
.ym h4{margin:0 3px 5px;font-size:13px;display:flex;justify-content:space-between;align-items:baseline;font-weight:650}
.ym h4 span{font-size:11px;font-weight:600;color:var(--accent)}
.ymg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.ymg span{font-size:9.5px;text-align:center;height:15px;line-height:15px;border-radius:50%;color:var(--ink-2);margin:0 auto;width:15px}
.ymg .w{color:var(--muted);font-size:8.5px;width:auto}
.ymg .h{color:#fff;font-weight:700}
.ymg .h.m{box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.6px currentColor}
.ymg .t{box-shadow:inset 0 0 0 1.2px var(--accent);color:var(--accent);font-weight:700}
@media (min-width:700px){.ymg span{font-size:11px;height:22px;line-height:22px;width:22px}.ymg .w{font-size:10px}.ym{padding:10px 8px 10px}.ym h4{font-size:14px}}
.ysum{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--ink-2)}
.ysum b{color:var(--ink)}
.ysum i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.zhint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 10px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#10141b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{color:#10141b}}
.cal-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.todaybtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 10px;font-size:13px;color:var(--ink-2)}
.ybar{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:58px;margin-top:10px;padding:0 2px}
.ybar button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;color:var(--muted);font-size:10.5px}
.ybar i{display:block;width:100%;max-width:26px;border-radius:4px 4px 2px 2px;background:var(--accent-soft);min-height:3px}
.ybar button.has i{background:color-mix(in srgb,var(--accent) 55%,var(--accent-soft))}
.ybar button.on i{background:var(--accent)}
.ybar button.on{color:var(--ink);font-weight:700}
.ybar b{font-weight:600;font-size:10px;color:var(--ink-2);min-height:12px}
.cal-wrap{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
@media (min-width:900px){.cal-wrap{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}.cal-wrap .agenda{position:sticky;top:150px;max-height:calc(100vh - 170px);overflow:auto}}
.grid{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wk{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);background:var(--surface-2)}
.wk span{text-align:center;font-size:12px;color:var(--muted);padding:6px 0}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.dc{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;min-height:54px;padding:4px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;color:var(--ink);cursor:pointer;min-width:0}
.dc:nth-child(7n){border-right:0}
.dc.out{color:var(--muted);opacity:.45}
.dc .dn{font-size:13.5px;width:26px;height:26px;line-height:26px;border-radius:50%}
.dc.has .dn{font-weight:700}
.dc.today .dn{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.dc.sel{background:var(--accent-soft)}
.dc.sel .dn{background:var(--accent);color:#fff;box-shadow:none}
:root[data-theme="dark"] .dc.sel .dn{color:#10141b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dc.sel .dn{color:#10141b}}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:100%}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.dots em{font-style:normal;font-size:10px;color:var(--muted);line-height:7px}
.cc{display:none;flex-direction:column;gap:2px;width:100%}
.cc span{display:block;font-size:11.5px;line-height:1.35;padding:1px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;border-left:3px solid;background:var(--surface-2)}
.cc em{font-style:normal;font-size:11px;color:var(--muted);text-align:left;padding-left:5px}
@media (min-width:900px){.dc{min-height:92px;align-items:stretch}.dc .dn{align-self:flex-end;width:24px;height:24px;line-height:24px;font-size:13px}.dc .dots{display:none}.dc .cc{display:flex}}
.agenda{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px 10px}
.ag-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 2px 6px;border-bottom:1px solid var(--line)}
.ag-h strong{font-size:15px}
.ag-h button{border:0;background:none;color:var(--accent);font-size:13px;padding:0}
.ag-sec{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;margin:12px 2px 2px}
.ev{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;color:var(--ink);cursor:pointer}
.ev:last-child{border-bottom:0}
.ev .bar{flex:0 0 4px;border-radius:3px;align-self:stretch}
.ev .dt{flex:0 0 auto;width:40px;font-size:12px;color:var(--muted);line-height:1.35;padding-top:1px}
.ev .dt b{display:block;font-size:17px;color:var(--ink);font-weight:650}
.ev .bd{flex:1;min-width:0}
.ev .t1{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.ev .co{font-weight:650;font-size:14.5px}
.ev .ct{font-size:12.5px;color:var(--ink-2)}
.ev .nth{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.ev .pv{font-size:13px;color:var(--ink-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.ev .pv mark,.ev .co mark{background:var(--mark);color:inherit;border-radius:2px}
.ag-empty{color:var(--muted);font-size:13.5px;padding:14px 2px}
.cal-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.pend{border:1px dashed var(--warm);background:var(--warm-soft);color:var(--warm);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:600}
.cal-foot label{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.cal-foot select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:2px 4px;font-size:12.5px}
.tl-m{display:flex;align-items:baseline;gap:8px;margin:18px 2px 6px}
.tl-m strong{font-size:15px}
.tl-m span{font-size:12.5px;color:var(--muted)}
.tl-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.fix{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px}
.fix .t1{display:flex;gap:6px;align-items:baseline}
.fix .co{font-weight:650}
.fix .nth{margin-left:auto;font-size:12px;color:var(--muted)}
.fix .pv{font-size:13px;color:var(--ink-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fix .row2{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.fix input[type=date]{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 8px;font-size:14px}
.fix .hint{font-size:12px;color:var(--warm)}
.g-box{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}
.g-box svg{display:block;width:100%;height:62vh;min-height:360px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.g-tools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.g-tools button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:17px;line-height:1}
.g-legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.g-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.g-legend i.sq{border-radius:3px}
.g-legend i.ln{width:18px;height:0;border-top:2px solid var(--muted);border-radius:0;vertical-align:3px}
.g-legend i.ln.d{border-top-style:dashed}
.g-legend i.ln.h{border-top:2px dotted var(--hub)}
svg .e{stroke:var(--muted);stroke-opacity:.55;fill:none}
svg .e.same{stroke-dasharray:5 4}
svg .e.hub{stroke:var(--hub);stroke-dasharray:2 3;stroke-opacity:.6}
svg .n circle,svg .n rect{stroke:var(--surface);stroke-width:2}
svg .n text{font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3.2px;stroke-linejoin:round;pointer-events:none}
svg .n{cursor:pointer}
svg .dim{opacity:.13}
svg .n.sel text{font-weight:700}
svg .n.qhit circle,svg .n.qhit rect{stroke:var(--mark);stroke-width:4}
.g-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.g-panel h3{margin:0 0 2px;font-size:16px}
.g-panel .sub{margin-bottom:8px}
.g-hint{color:var(--muted);font-size:13px}
.comp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13.5px}

<script>
(function(){
'use strict';
var PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
var ENC = null, CURPW = null;
var CFG = (function(){ try{ return JSON.parse(document.getElementById('app-config').textContent)||{}; }catch(e){ return {}; } })();
var SERVER = /^https?:$/.test(location.protocol);
var SNAP = false, EMB = null, SERVER_HTTP = SERVER; SERVER = false;
var CARDS_FILE = 'cards.enc.json';
function readEmbedded(){
  var raw = (document.getElementById('app-enc').textContent||'').trim();
  try{ EMB = raw && raw!=='null' ? JSON.parse(raw) : null; }catch(e){ EMB = null; }
  return EMB;
}
function sourcesFor(file){
  var list = [];
  if(SERVER_HTTP) list.push(file);                                  // same folder
  if(SERVER_HTTP && CFG.repo && location.pathname.indexOf('/'+CFG.repo+'/')!==0) list.push('/'+CFG.repo+'/'+file);   // same site, data repo folder (app on the homepage)
  if(CFG.owner && CFG.repo){
    var b = CFG.branch || 'main';
    var pages = 'https://'+CFG.owner+'.github.io/'+CFG.repo+'/'+file;
    list.push('https://cdn.jsdelivr.net/gh/'+CFG.owner+'/'+CFG.repo+'@'+b+'/'+file);   // CDN mirror, usually reachable from mainland China
    if(!(SERVER_HTTP && location.href.indexOf('https://'+CFG.owner+'.github.io/'+CFG.repo+'/')===0)) list.push(pages);
    list.push('https://raw.githubusercontent.com/'+CFG.owner+'/'+CFG.repo+'/'+b+'/'+file);
  }
  return list;
}
function pubT(j){ return (j && Date.parse(j.pubAt||'')) || 0; }
function fetchJSON(u, onBytes, signal){
  return fetch(u, {cache:'no-cache', signal:signal}).then(function(r){
    if(!r.ok) throw new Error(r.status);
    if(!r.body || !r.body.getReader) return r.text();
    var rd = r.body.getReader(), parts = [], n = 0;
    function pump(){ return rd.read().then(function(x){ if(x.done) return; parts.push(x.value); n += x.value.length; if(onBytes) onBytes(n); return pump(); }); }
    return pump().then(function(){ var all = new Uint8Array(n), o = 0; parts.forEach(function(p){ all.set(p,o); o += p.length; }); return new TextDecoder().decode(all); });
  }).then(function(txt){ return JSON.parse(txt); });
}
/* fetch one file from every source at once: report the first good copy, then any newer copy that arrives later */
function raceFetch(file, h){
  var srcs = sourcesFor(file), done = 0, best = null, maxB = 0, ctls = [];
  if(!srcs.length){ if(h.fail) h.fail(); return; }
  srcs.forEach(function(u){
    var c = window.AbortController ? new AbortController() : null; ctls.push(c);
    var tm = setTimeout(function(){ if(c) c.abort(); }, 60000);
    fetchJSON(u, function(b){ if(b > maxB){ maxB = b; if(h.progress) h.progress(b); } }, c ? c.signal : undefined).then(function(j){
      clearTimeout(tm);
      if(!j || !j.ct || !j.salt) throw new Error('bad');
      if(!best){ best = j; h.first(j, u); if(h.abortRest) ctls.forEach(function(x){ if(x && x!==c) try{ x.abort(); }catch(e){} }); }
      else if(pubT(j) > pubT(best)){ best = j; if(h.newer) h.newer(j, u); }
    }).catch(function(){ clearTimeout(tm); }).then(function(){ done++; if(done===srcs.length && !best && h.fail) h.fail(); });
  });
}
/* small key-value store on this device (IndexedDB), for instant start next time */
function idb(){ return new Promise(function(res, rej){ try{ var r = indexedDB.open('visit-log', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); }; r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }catch(e){ rej(e); } }); }
function idbGet(k){ return idb().then(function(db){ return new Promise(function(res){ try{ var q = db.transaction('kv','readonly').objectStore('kv').get(k); q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ res(null); }; }catch(e){ res(null); } }); }).catch(function(){ return null; }); }
function idbSet(k, v){ return idb().then(function(db){ return new Promise(function(res){ try{ var tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = function(){ res(true); }; tx.onerror = function(){ res(false); }; }catch(e){ res(false); } }); }).catch(function(){ return false; }); }
var HOOK = {adopt:null, late:null};
var LSKEY = 'visit-log::enc::客户名单及拜访记录';
var SSKEY = 'visit-log::pw';
var CK = null; // {key, salt, iter} used for all new encryption

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function ssSet(k,v){ try{ if(v==null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); }catch(e){} }
(function(){ var th = lsGet('visit-log::theme'); if(th) document.documentElement.setAttribute('data-theme', th); })();
document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-eye]') : null; if(!b) return;
  e.preventDefault(); e.stopImmediatePropagation();
  var i = b.parentNode.querySelector('input'); if(!i) return;
  var show = i.type === 'password'; i.type = show ? 'text' : 'password';
  b.classList.toggle('on', show); b.setAttribute('aria-label', show ? '隐藏密码' : '显示密码'); b.title = show ? '隐藏密码' : '显示密码';
  try{ var n = i.value.length; i.focus(); i.setSelectionRange(n, n); }catch(err){}
}, true);

/* ---------- crypto (AES-256-GCM, key from PBKDF2-SHA256) ---------- */
function b64e(buf){ var b=new Uint8Array(buf), s=''; for(var i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(s); }
function b64d(s){ var bin=atob(s), b=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b; }
function derive(pw, salt, iter){
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:iter, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  });
}
function decryptWith(key, o){
  return crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(o.iv)}, key, b64d(o.ct)).then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });
}
function encryptPayload(obj){
  var iv = crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, CK.key, new TextEncoder().encode(JSON.stringify(obj))).then(function(ct){
    return {v:1, alg:'AES-GCM/PBKDF2-SHA256', iter:CK.iter, salt:b64e(CK.salt), iv:b64e(iv), ct:b64e(ct)};
  });
}
function unlock(pw){
  var fsalt = b64d(ENC.salt);
  return derive(pw, fsalt, ENC.iter).then(function(fkey){
    return decryptWith(fkey, ENC).then(function(P){
      CK = {key:fkey, salt:fsalt, iter:ENC.iter};
      var raw = lsGet(LSKEY), L = null;
      try{ L = raw ? JSON.parse(raw) : null; }catch(e){ L = null; }
      var serverPub = ENC.pubAt || null, conflict = false;
      if(!L || !L.enc) return {P:P, L:null};
      if(serverPub){
        if(!L.unpub) return {P:P, L:null};
        if(L.base !== serverPub) conflict = true;
      } else if(!(Date.parse(L.savedAt) > Date.parse(P.data.savedAt))) return {P:P, L:null};
      var lsalt = b64d(L.enc.salt);
      var kp = (L.enc.salt===ENC.salt && L.enc.iter===ENC.iter) ? Promise.resolve(fkey) : derive(pw, lsalt, L.enc.iter);
      return kp.then(function(lkey){
        return decryptWith(lkey, L.enc).then(function(LP){ if(!LP || !LP.data || !Array.isArray(LP.data.sheets) || !LP.data.sheets.length) return {P:P, L:null}; if(conflict) return {P:P, L:null, C:LP, CL:L}; CK = {key:lkey, salt:lsalt, iter:L.enc.iter}; return {P:P, L:LP}; });
      }).catch(function(){ return {P:P, L:null}; });
    });
  });
}
(function boot(){
  var f = document.getElementById('lockf'), inp = document.getElementById('pw'), btn = document.getElementById('pwbtn'), msg = document.getElementById('lkmsg');
  if(!(window.crypto && crypto.subtle)){ msg.textContent = '当前浏览器不支持解密，请用 Chrome / Safari / Edge 打开'; btn.disabled = true; return; }
  var pending = null, busy = false, started = false, netDone = false, fromCache = false;
  readEmbedded();
  function status(t){ if(busy || started) return; msg.style.color = 'var(--muted)'; msg.textContent = t; }
  function kb(n){ return n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB'; }
  function useEnc(enc, how){
    if(started){ if(HOOK.adopt) HOOK.adopt(enc); else HOOK.late = enc; return; }
    if(busy){ HOOK.late = enc; return; }
    if(!ENC || pubT(enc) > pubT(ENC) || how==='net' && !ENC.pubAt){ ENC = enc; }
    if(how==='net'){ SERVER = true; SNAP = false; }
    if(pending) go(pending); else if(!msg.textContent || /载入|下载|连接/.test(msg.textContent)) status('');
  }
  status('正在连接服务器…（可以先输入密码）');
  idbGet('data').then(function(c){ if(c && c.ct && !netDone){ fromCache = true; useEnc(c, 'cache'); } });
  raceFetch(CFG.path || 'data.enc.json', {
    progress: function(n){ if(!ENC) status('正在从服务器载入数据… '+kb(n)+'（可以先输入密码）'); },
    first: function(j){ netDone = true; idbSet('data', j); useEnc(j, 'net'); },
    newer: function(j){ idbSet('data', j); useEnc(j, 'net'); },
    fail: function(){
      netDone = true;
      if(ENC){ SNAP = fromCache ? 'cache' : true; if(started && HOOK.adopt) HOOK.adopt(null); return; }

/* ---------- images ---------- */
function compress(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var s = Math.min(1, 1000/Math.max(img.width,img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      var g = c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      var url = c.toDataURL('image/webp',0.7);
      if(url.indexOf('data:image/webp')!==0) url = c.toDataURL('image/jpeg',0.75);
      cb(url);
    };
    img.onerror = function(){ toast('无法读取这张图片'); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

var GHKEY = 'visit-log::gh';
function ghCfg(){
  var c = {}; try{ c = JSON.parse(lsGet(GHKEY)||'{}')||{}; }catch(e){ c = {}; }
  var auto = {};
  if(/\.github\.io$/i.test(location.hostname)){ auto.owner = location.hostname.split('.')[0]; var seg = location.pathname.split('/').filter(Boolean); if(seg.length && !/\.html?$/i.test(seg[0])) auto.repo = seg[0]; }
  return {owner: c.owner || auto.owner || CFG.owner || '', repo: c.repo || auto.repo || CFG.repo || '', branch: c.branch || CFG.branch || 'main', path: c.path || CFG.path || 'data.enc.json', tok: c.tok || null};
}
function saveGhCfg(c){ lsSet(GHKEY, JSON.stringify(c)); }
function getToken(){ var c = ghCfg(); if(!c.tok) return Promise.resolve(null); return decryptWith(CK.key, c.tok).then(function(o){ return o.t; }).catch(function(){ return null; }); }
function setToken(tok){ var c = ghCfg(); if(!tok){ c.tok=null; saveGhCfg(c); return Promise.resolve(); } return encryptPayload({t:tok}).then(function(e){ c.tok = e; saveGhCfg(c); }); }
function ghFetch(path, tok, opt){
  opt = opt || {}; var h = {'Accept': opt.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json'};
  if(tok) h.Authorization = 'Bearer ' + tok;
  if(opt.body) h['Content-Type'] = 'application/json';
  return fetch('https://api.github.com' + path, {method: opt.method||'GET', headers:h, body: opt.body ? JSON.stringify(opt.body) : undefined, cache:'no-store'});
}

function pubSetSave(){
  var c = ghCfg(), msg = document.getElementById('gh-msg');

  var nt = document.getElementById('gh-t').value.trim();

  (nt ? setToken(nt).then(function(){ return nt; }) : getToken()).then(function(tok){
    if(!tok){ msg.textContent = '还没有填授权码'; return; }
    return ghFetch('/repos/'+c.owner+'/'+c.repo, tok).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, s:r.status, j:j}; }); }).then(function(x){
      if(!x.ok){ msg.textContent = x.s===401 ? '授权码无效或已过期' : (x.s===404 ? '找不到这个仓库，或授权码没有这个仓库的权限' : '连接失败（'+x.s+'）'); return; }
      if(!(x.j.permissions && x.j.permissions.push)){ msg.textContent = '能看到仓库，但授权码没有写入权限（需要 Contents: Read and write）'; return; }
      document.getElementById('layer').innerHTML=''; toast('设置成功，可以发布了');
    });
  }).catch(function(){ msg.textContent = '网络错误，请稍后再试'; });

function usedImages(){ var used = {}; DATA.sheets.forEach(function(s){ s.records.forEach(function(r){ r.cards.forEach(function(c){ if(c.img) used[c.img]=IMAGES[c.img]; }); }); }); return used; }
function fmtTime(iso){ var d=new Date(iso); if(isNaN(d)) return iso||''; function p(n){return (n<10?'0':'')+n;} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function ghPut(c, tok, path, encObj, msg){
  var api = '/repos/'+c.owner+'/'+c.repo+'/contents/'+path;
  return ghFetch(api+'?ref='+encodeURIComponent(c.branch), tok).then(function(r){
    if(r.status===404) return null; if(!r.ok) throw {s:r.status}; return r.json().then(function(j){ return j.sha; });
  }).then(function(sha){
    var body = {message: msg, content: btoa(JSON.stringify(encObj)), branch: c.branch}; if(sha) body.sha = sha;
    return ghFetch(api, tok, {method:'PUT', body:body}).then(function(r){ if(!r.ok) throw {s:r.status}; });
  });
}
function purgeCdn(c, path){ try{ fetch('https://purge.jsdelivr.net/gh/'+c.owner+'/'+c.repo+'@'+c.branch+'/'+path, {mode:'no-cors'}).catch(function(){}); }catch(e){} }
function publish(){
  if(PUBBING) return;

    if(!tok || !c.owner || !c.repo){ openPubSet(); toast('请先完成发布设置'); return; }
    PUBBING = true; renderBanner();
    var api = '/repos/'+c.owner+'/'+c.repo+'/contents/'+c.path, pubAt, wroteCards = false;
    return ensureCards().then(function(ok){
      if(!ok && needCards().length) throw {cards:1};
      return ghFetch(api+'?ref='+encodeURIComponent(c.branch), tok, {raw:true}).then(function(r){ return r.ok ? r.json() : null; });
    }).then(function(cur){
      if(cur && cur.pubAt && BASE && cur.pubAt !== BASE){
        if(!confirm('服务器上有一个 '+fmtTime(cur.pubAt)+' 发布的版本，比你开始修改时的版本新（可能是在另一台设备上发布的）。\n\n继续发布会覆盖它。确定继续吗？')) throw {cancel:1};
      }
      pubAt = new Date().toISOString();
      var needWrite = CARDS.dirty || CARDS.inline || !(cur && cur.cards);
      if(!needWrite) return null;
      return encryptPayload({images: usedImages()}).then(function(ce){ ce.pubAt = pubAt; wroteCards = true; return ghPut(c, tok, CARDS_FILE, ce, '更新名片图片 '+fmtTime(pubAt)); });
    }).then(function(){
      return encryptPayload({data:DATA}).then(function(e){
        e.pubAt = pubAt; e.cards = CARDS_FILE;
        return ghPut(c, tok, c.path, e, '更新数据 '+fmtTime(pubAt)).then(function(){ return e; });
      });
    }).then(function(e){
      PUBBING = false; BASE = pubAt; dirty = false; CONFLICT = null; CARDS.dirty = false; CARDS.inline = false;
      purgeCdn(c, c.path); if(wroteCards) purgeCdn(c, CARDS_FILE);
      idbSet('data', e);
      encryptPayload({data:DATA, images:usedImages()}).then(function(full){ lsSet(LSKEY, JSON.stringify({savedAt:DATA.savedAt, base:BASE, unpub:false, enc:full})); });

    });
  }).catch(function(err){
    PUBBING = false; renderBanner();
    if(err && err.cancel) return;
    if(err && err.cards){ renderBanner('发布暂停：名片图片还没下载完整，为了不弄丢图片，请联网稍后再点「发布」。'); return; }
    var s = err && err.s;
    renderBanner(s===401 ? '发布失败：授权码无效或已过期，请到「发布设置」更新。' : s===403||s===404 ? '发布失败：授权码没有这个仓库的写入权限。' : s===409 ? '发布失败：服务器上的文件刚被改动，请稍后再试。' : '发布失败：网络错误，请稍后再试。修改仍保存在本机。');
  });
}
function softRender(){ if(Object.keys(ui.drafts).length || document.querySelector('#layer .overlay') || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) return; var y = window.pageYOffset; render(); window.scrollTo(0, y); }
function needCards(){ var need = []; DATA.sheets.forEach(function(s){ s.records.forEach(function(r){ r.cards.forEach(function(c){ if(c.img && !IMAGES[c.img]) need.push(c.img); }); }); }); return need; }
function keyFor(enc){ return (enc.salt===b64e(CK.salt) && enc.iter===CK.iter) ? Promise.resolve(CK.key) : derive(CURPW, b64d(enc.salt), enc.iter); }
function mergeCards(enc){
  return keyFor(enc).then(function(k){ return decryptWith(k, enc); }).then(function(p){ var imgs = (p && p.images) || {}, n = 0; for(var key in imgs){ if(!IMAGES[key]){ IMAGES[key] = imgs[key]; n++; } } return n; }).catch(function(){ return 0; });
}
function ensureCards(){
  if(!needCards().length){ CARDS.loaded = true; return Promise.resolve(true); }
  if(CARDS.loading) return CARDS.loading;
  CARDS.loading = idbGet('cards').then(function(c){ return c ? mergeCards(c) : 0; }).then(function(n){
    if(n) softRender();
    if(!needCards().length){ CARDS.loaded = true; return true; }
    return new Promise(function(res){
      var settled = false;
      raceFetch(CARDS_FILE, {

    case 'calJump': ui.cal.m=+t.dataset.to; ui.cal.day=null; render(); break;
    case 'calDay': if(ui._swiped && Date.now()-ui._swiped<400) break; var dv=t.dataset.to ? +t.dataset.to : null; ui.cal.day = (dv && ui.cal.day===dv) ? null : dv; render();
      if(dv && window.innerWidth<900){ var ag=document.querySelector('.agenda'); if(ag) window.scrollTo({top: ag.getBoundingClientRect().top + window.pageYOffset - 150, behavior:'smooth'}); } break;
    case 'calMode': var nm=t.dataset.to, om=ui.cal.mode; ui.cal.mode=nm; ui.calAnim = (om==='year'&&nm==='month')?'z-in':(om==='month'&&nm==='year')?'z-out':null; render(); break;
    case 'calPend': openPend(); break;
    case 'fixDate': fixDate(t.dataset.to, +t.dataset.vi); break;
    case 'goto':
      e.preventDefault();
      var fromId = t.dataset.from || null; var inGraph = ui.view==='graph' || ui.view==='cal';
      if(!fromId && ui._hubFrom && document.querySelector('#layer .overlay')){ pushNav(snapshot(ui._hubFrom.id, ui._hubFrom.fvi, ui._hubFrom.hit)); }
      else pushNav(snapshot(inGraph?null:fromId, t.dataset.fvi!=null?+t.dataset.fvi:null, t.dataset.fvi!=null?t.textContent:null));
      ui._hubFrom=null;
      showRecord(t.dataset.to, t.dataset.vi!=null?+t.dataset.vi:null, t.dataset.hit||null); break;
    case 'back': if(useHist) history.back(); else doBack(); break;
    case 'hub':
      e.preventDefault();
      if(t.dataset.from && ui.view==='list'){ ui._hubFrom = {id:t.dataset.from, fvi:t.dataset.fvi!=null?+t.dataset.fvi:null, hit:t.textContent}; } else ui._hubFrom=null;
      openHub(t.dataset.to); break;
    case 'hubEdit': openHubEdit(t.dataset.to||''); break;
    case 'hubSave':
      var nm=document.getElementById('hb-n').value.trim(); if(nm.length<2){ toast('名称至少 2 个字'); return; }
      var hid=t.dataset.to, hb = hid ? hubById(hid) : null;
      if(!hb){ hb={id:uid()}; DATA.hubs.push(hb); }
      hb.name=nm; hb.alias=splitAlias(document.getElementById('hb-a').value); hb.note=document.getElementById('hb-o').value.trim();
      document.getElementById('layer').innerHTML=''; persist(); render(); toast('已保存'); break;
    case 'hubDel': if(confirm('删除这个关键人物？（不影响客户记录）')){ DATA.hubs=DATA.hubs.filter(function(x){return x.id!==t.dataset.to;}); if(ui.gsel==='h:'+t.dataset.to) ui.gsel=null; document.getElementById('layer').innerHTML=''; persist(); render(); } break;
    case 'gsel': if(t.dataset.to){ selectNode(t.dataset.to); var gb=document.querySelector('.g-box'); if(gb) window.scrollTo(0, gb.getBoundingClientRect().top+window.pageYOffset-140); } else selectNode(null); break;
    case 'gz': var cx=GV.x+GV.w/2, cy=GV.y+GV.h/2; zoomAt(+t.dataset.z, cx, cy); break;
    case 'gfit': var gg=linkIndex().g; if(gg.box){ GV.x=gg.box.x; GV.y=gg.box.y; GV.w=gg.box.w; GV.h=gg.box.h; setVB(); } break;
    case 'toggle': ui.open[id] = !ui.open[id]; rerenderRec(id); break;
    case 'jump':
      ui.open[id] = true; rerenderRec(id);
      var vs = document.querySelectorAll('.rec[data-id="'+id+'"] .visit'), tv = vs[+t.dataset.i];
      if(tv){ window.scrollTo({top: tv.getBoundingClientRect().top + window.pageYOffset - 150, behavior:'smooth'}); tv.classList.add('flash'); }
      break;
    case 'cards': ui.cards[id] = !ui.cards[id]; rerenderRec(id); break;
    case 'img': ui.imgs[t.dataset.key] = !ui.imgs[t.dataset.key]; rerenderRec(t.dataset.key.split(':')[0]); break;
    case 'zoom':
      var L = document.getElementById('layer');
      L.innerHTML = '<div class="lightbox" data-act="lbtoggle"><img src="'+IMAGES[t.dataset.img]+'" alt="名片"></div><button class="lb-x" data-act="lbclose">✕</button>'; break;
    case 'lbtoggle': if(e.target.tagName==='IMG') t.classList.toggle('zoom'); else document.getElementById('layer').innerHTML=''; break;
    case 'lbclose': document.getElementById('layer').innerHTML=''; break;
    case 'addVisit': ui.adding[id] = today()+' '; rerenderRec(id); var ta=document.querySelector('.rec[data-id="'+id+'"] textarea'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);} break;
    case 'addVisitCancel': delete ui.adding[id]; rerenderRec(id); break;
    case 'addVisitSave':
      var txt = (ui.adding[id]||'').trim(); if(!txt || txt===today()){ toast('记录内容为空'); return; }
      findRec(id).r.visits.push(txt); delete ui.adding[id]; persist(); renderTabs(); rerenderRec(id); toast('已保存'); break;
    case 'edit': fr = findRec(id); ui.drafts[id] = JSON.parse(JSON.stringify({f:fr.r.f, visits:fr.r.visits, cards:fr.r.cards, short:fr.r.short||'', group:fr.r.group||'', aliasText:(fr.r.alias||[]).join('、')})); delete ui.adding[id]; rerenderRec(id); break;
    case 'editCancel': delete ui.drafts[id]; rerenderRec(id); break;
    case 'editSave':
      fr = findRec(id); d = ui.drafts[id];
      Object.keys(d.f).forEach(function(k){ d.f[k] = String(d.f[k]==null?'':d.f[k]); });
      fr.r.f = d.f; fr.r.visits = d.visits.filter(function(v){return String(v).trim();}); fr.r.cards = d.cards.filter(function(c){return (c.text||'').trim()||c.img;}); fr.r.short = (d.short||'').trim(); fr.r.group = (d.group||'').trim(); fr.r.alias = splitAlias(d.aliasText);
      if(d.sheet && d.sheet!==fr.sh.id){ var tsh=DATA.sheets.filter(function(s){return s.id===d.sheet;})[0]; if(tsh){ fr.sh.records.splice(fr.i,1); tsh.records.push(fr.r); fr.r.f.no = fr.r.f.no||''; ui.tab=tsh.id; } }
      delete ui.drafts[id]; persist(); render(); if(d.sheet){ var el2=document.querySelector('.rec[data-id="'+id+'"]'); if(el2) el2.scrollIntoView({block:'center'}); } toast('已保存修改'); break;
    case 'vAdd': ui.drafts[id].visits.push(today()+' '); rerenderRec(id); break;
    case 'vDel': if(confirm('删除这条拜访记录？')){ ui.drafts[id].visits.splice(+t.dataset.i,1); rerenderRec(id);} break;
    case 'vUp': i=+t.dataset.i; if(i>0){ d=ui.drafts[id].visits; var x=d[i]; d[i]=d[i-1]; d[i-1]=x; rerenderRec(id);} break;
    case 'cAdd': ui.drafts[id].cards.push({img:null,text:''}); rerenderRec(id); break;
    case 'cDel': if(confirm('删除这张名片？')){ ui.drafts[id].cards.splice(+t.dataset.i,1); rerenderRec(id);} break;
    case 'recDel': fr = findRec(id); if(confirm('确定删除「'+(fr.r.f.company||'')+'」及其全部记录？')){ fr.sh.records.splice(fr.i,1); delete ui.drafts[id]; persist(); render(); toast('已删除'); } break;
    case 'new': openNew(); break;
    case 'publish': if(menu) menu.remove(); publish(); break;
    case 'pubset': if(menu) menu.remove(); openPubSet(); break;
    case 'pubSetSave': pubSetSave(); break;
    case 'pubSetClear': setToken(null).then(function(){ document.getElementById('layer').innerHTML=''; toast('已清除授权码'); }); break;
    case 'useLocal': if(confirm('改用这台设备上未发布的版本？发布时会覆盖服务器上较新的内容。')){ DATA = CONFLICT.data; IMAGES = CONFLICT.images || IMAGES; CONFLICT = null; dirty = true; LV++; persist(); render(); } break;
    case 'dropLocal': if(confirm('丢弃这台设备上未发布的修改？')){ CONFLICT = null; lsSet(LSKEY, ''); renderBanner(); } break;
    case 'cats': if(menu) menu.remove(); openCats(); break;
    case 'catAdd': catDraft.push({id:'c'+uid(), short:'', name:'', n:0, isNew:true}); renderCats(); var ins=document.querySelectorAll('.cat-row input'); if(ins.length) ins[ins.length-2].focus(); break;
    case 'catUp': i=+t.dataset.i; if(i>0){ var cx=catDraft[i]; catDraft[i]=catDraft[i-1]; catDraft[i-1]=cx; renderCats(); } break;
    case 'catDel': i=+t.dataset.i; if(catDraft[i].n>0){ toast('这个类别下还有客户，请先在客户「编辑」里改到其他类别'); return; } if(catDraft.length<2){ toast('至少保留一个类别'); return; } catDraft.splice(i,1); renderCats(); break;
    case 'catSave': saveCats(); break;
    case 'lock': ssSet(SSKEY, null); location.reload(); break;
    case 'chpw': if(menu) menu.remove();
      document.getElementById('layer').innerHTML = '<div class="overlay" data-act="closeNew"><div class="sheet" data-stop="1"><h2>修改密码</h2><div class="form"><label>新密码<span class="pwbox"><input type="password" id="np1" autocomplete="new-password"><button type="button" class="eye" data-eye aria-label="显示密码" title="显示密码"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="eo" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle class="eo" cx="12" cy="12" r="3"/><path class="ec" d="M3 3l18 18M10.6 5.1A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span></label><label>再输入一次<span class="pwbox"><input type="password" id="np2" autocomplete="new-password"><button type="button" class="eye" data-eye aria-label="显示密码" title="显示密码"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="eo" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle class="eo" cx="12" cy="12" r="3"/><path class="ec" d="M3 3l18 18M10.6 5.1A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span></label><div class="actions"><button class="btn pri" data-act="chpwSave">确定</button><button class="btn" data-act="closeNew">取消</button></div></div></div></div>';
      setTimeout(function(){ var x=document.getElementById('np1'); if(x) x.focus(); }, 50); break;
    case 'chpwSave':
      var p1 = document.getElementById('np1').value, p2 = document.getElementById('np2').value;
      if(!p1){ toast('请输入新密码'); return; } if(p1!==p2){ toast('两次输入不一致'); return; }
      var ns = crypto.getRandomValues(new Uint8Array(16));
      getToken().then(function(oldTok){ return derive(p1, ns, 600000).then(function(k){ return {k:k, tok:oldTok}; }); }).then(function(o){ var k=o.k;
        CK = {key:k, salt:ns, iter:600000}; CARDS.dirty = true; ssSet(SSKEY, p1); CURPW = p1; if(o.tok) setToken(o.tok);
        document.getElementById('layer').innerHTML = ''; persist();
        renderBanner(SERVER ? '密码已修改。点「发布」后，所有人都要用新密码打开。' : '密码已修改。请「下载更新文件」并替换旧文件，否则旧文件仍使用旧密码。');
      }); break;
    case 'closeNew': newDraft=null; document.getElementById('layer').innerHTML=''; break;
    case 'saveNew': saveNew(); break;
  }
});
document.addEventListener('input', function(e){
  var t = e.target, a = t.dataset.actInput; if(!a) return;
  var id = t.dataset.id;
  if(a==='adding') ui.adding[id] = t.value;
  else if(a==='df') ui.drafts[id].f[t.dataset.k] = t.value;
  else if(a==='dv') ui.drafts[id].visits[+t.dataset.i] = t.value;
  else if(a==='dc') ui.drafts[id].cards[+t.dataset.i].text = t.value;
  else if(a==='dshort') ui.drafts[id].short = t.value;
  else if(a==='dalias') ui.drafts[id].aliasText = t.value;
  else if(a==='dgroup') ui.drafts[id].group = t.value;
  else if(a==='dsheet') ui.drafts[id].sheet = t.value;
  else if(a==='nsheet') newDraft.sheet = t.value;
  else if(a==='nf') newDraft.f[t.dataset.k] = t.value;
  else if(a==='cs') catDraft[+t.dataset.i].short = t.value;
  else if(a==='cn') catDraft[+t.dataset.i].name = t.value;
  else if(a==='nv') newDraft.visit = t.value;
  else if(a==='nc') newDraft.card = t.value;
});
document.addEventListener('change', function(e){
  if(e.target.dataset && e.target.dataset.cal==='wk'){ lsSet('visit-log::wkstart', e.target.value); render(); return; }
  if(e.target.tagName==='SELECT' && e.target.dataset.actInput){ e.target.dispatchEvent(new Event('input',{bubbles:true})); return; }
  var t = e.target, a = t.dataset.actFile; if(!a || !t.files || !t.files[0]) return;
  compress(t.files[0], function(url){
    if(a==='nimg'){ newDraft.img = url; renderNew(); }
    else { var k = uid(); IMAGES[k] = url; CARDS.dirty = true; ui.drafts[t.dataset.id].cards[+t.dataset.i].img = k; rerenderRec(t.dataset.id); }
  });
});
var qi = document.getElementById('q'), qt;
qi.addEventListener('input', function(){ clearTimeout(qt); qt = setTimeout(function(){ ui.q = qi.value; render(); }, 150); });
document.getElementById('sort').addEventListener('change', function(e){ ui.sort = e.target.value; renderList(); });
var sp = document.getElementById('split'); sp.checked = ui.split;
sp.addEventListener('change', function(){ ui.split = sp.checked; lsSet('visit-log::split', sp.checked?'1':'0'); renderList(); });
document.addEventListener('focusin', function(e){ if(e.target.matches('textarea,.form input')) document.body.classList.add('editing'); });
document.addEventListener('focusout', function(){ document.body.classList.remove('editing'); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') document.getElementById('layer').innerHTML=''; });

document.getElementById('ttl').textContent = DATA.title;
HOOK.adopt = adoptRemote;
renderBanner(); render(); checkNewer();
if(HOOK.late){ var lt = HOOK.late; HOOK.late = null; adoptRemote(lt); }
setTimeout(ensureCards, 300);
}
})();
</script>
